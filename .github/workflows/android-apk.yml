# Builds a signed Android APK and publishes it as a GitHub Release.
#
# Three ways to release:
#   1. Bump "version" in apps/mobile/app.json and push to the default branch
#      (the commit message becomes the release notes; add [required] to force the update)
#   2. Push a tag:      git tag v1.1.0 && git push origin v1.1.0
#   3. Run manually:    Actions > Android APK > Run workflow (store, version, notes, required)
# A version that already has a release is skipped.
#
# Several stores (one server): "store" picks apps/mobile/stores/<store>.json
# (app name, package id, icon). The default store "spir" is released as
# "vX.Y.Z"; any other store as "<store>-vX.Y.Z", and each store's app only
# updates to its own releases.
#
# Installed apps pick the new release up automatically: the backend's
# /store/mobile-version reads the latest release (MOBILE_GITHUB_REPO), the app
# shows "new version available" (or blocks when the notes contain [required]),
# downloads the APK and opens the Android installer.
#
# Signing: works out of the box with React Native's standard debug key (same
# key on every build, so in-app updates between these builds install).
# Optional, recommended before a public launch: add these repository secrets to
# sign with your own private key instead (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of credentials/spir-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Switching keys later means users reinstall the app once.
# Optional repository variable:
#   EXPO_PUBLIC_MEDUSA_BACKEND_URL   server address baked into the APK
#                                    (default: the shared server on Railway)

name: Android APK

on:
  push:
    branches: [ccr-fb77656e-dw5gy8, main]
    paths: [apps/mobile/app.json, .github/workflows/android-apk.yml]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      store:
        description: "Store (slug in apps/mobile/stores, e.g. spir or glow)"
        required: true
        default: spir
      version:
        description: "Version (e.g. 1.1.0)"
        required: true
      notes:
        description: "What's new (shown to users)"
        required: false
        default: ""
      required_update:
        description: "Required update (older versions are blocked)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-${{ inputs.store || 'spir' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      code: ${{ steps.decide.outputs.code }}
      notes: ${{ steps.decide.outputs.notes }}
      store: ${{ steps.decide.outputs.store }}
      tag: ${{ steps.decide.outputs.tag }}
      app_name: ${{ steps.decide.outputs.app_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide version and whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_STORE: ${{ inputs.store }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_REQUIRED: ${{ inputs.required_update }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"; NOTES="$INPUT_NOTES"
            [ "$INPUT_REQUIRED" = "true" ] && NOTES="$NOTES"$'\n'"[required]"
          elif [ "$REF_TYPE" = "tag" ]; then
            RAW="$REF_NAME"; NOTES="$COMMIT_MESSAGE"
          else
            RAW=$(node -p "require('./apps/mobile/app.json').expo.version"); NOTES="$COMMIT_MESSAGE"
          fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$RAW')"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Monotonic Android versionCode derived from the version: 1.2.3 -> 10203
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          STORE="${INPUT_STORE:-spir}"
          if [ ! -f "apps/mobile/stores/$STORE.json" ]; then
            echo "::error::Unknown store '$STORE': add apps/mobile/stores/$STORE.json"; exit 1
          fi
          APP_NAME=$(node -p "require('./apps/mobile/stores/$STORE.json').app_name")
          TAG="v$VERSION"
          [ "$STORE" != "spir" ] && TAG="$STORE-v$VERSION"

          BUILD=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping"
            BUILD=false
          fi
          [ -z "$NOTES" ] && NOTES="نسخة جديدة من تطبيق $APP_NAME"

          {
            echo "build=$BUILD"
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "store=$STORE"
            echo "tag=$TAG"
            echo "app_name=$APP_NAME"
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$APP_NAME ($STORE) $VERSION (versionCode $CODE), tag $TAG, build=$BUILD"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.code }}
      APP_STORE: ${{ needs.prepare.outputs.store }}
      APK_NAME: ${{ needs.prepare.outputs.store == 'spir' && 'spir-shop' || needs.prepare.outputs.store }}
      ANDROID_NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v5

      - name: Choose signing key
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            echo "private=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the private release key"
          else
            echo "private=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_* secrets: signing with the standard React Native debug key (fine for a trial build)"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ANDROID_NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Set app version
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs")
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"))
            app.expo.version = process.env.VERSION
            app.expo.android.versionCode = Number(process.env.VERSION_CODE)
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n")
          '

      - name: Write private signing key
        if: steps.signing.outputs.private == 'true'
        working-directory: apps/mobile
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p credentials
          echo "$KS" | base64 -d > credentials/spir-release.jks
          {
            echo "SPIR_RELEASE_STORE_FILE=$PWD/credentials/spir-release.jks"
            echo "SPIR_RELEASE_STORE_PASSWORD=$KSP"
            echo "SPIR_RELEASE_KEY_ALIAS=$KA"
            echo "SPIR_RELEASE_KEY_PASSWORD=$KP"
          } > credentials/keystore.properties

      - name: Write app config
        working-directory: apps/mobile
        env:
          BACKEND_URL: ${{ vars.EXPO_PUBLIC_MEDUSA_BACKEND_URL }}
        run: |
          # The store's publishable key is discovered from the server at runtime (GET /mobile/config?store=)
          echo "EXPO_PUBLIC_MEDUSA_BACKEND_URL=${BACKEND_URL:-https://backend-production-eb711937.up.railway.app}" > .env
          echo "EXPO_PUBLIC_STORE=$APP_STORE" >> .env

      - name: Build signed APK
        working-directory: apps/mobile
        env:
          JDK17_HOME: ${{ env.JAVA_HOME }}
          GRADLE_WORKERS: "4"
        run: ./scripts/build-apk.sh

      - name: Verify signature
        working-directory: apps/mobile
        run: |
          # Fails if the APK is not validly signed; prints the signer for the log
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/$APK_NAME-$VERSION.apk" | grep -E "certificate (DN|SHA-256 digest)"

      - name: Remove signing material
        if: always()
        working-directory: apps/mobile
        run: rm -rf credentials

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ env.VERSION }}
          path: apps/mobile/dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.app_name }} ${{ env.VERSION }}
          body: ${{ needs.prepare.outputs.notes }}
          files: apps/mobile/dist/${{ env.APK_NAME }}-${{ env.VERSION }}.apk
          make_latest: ${{ needs.prepare.outputs.store == 'spir' && 'true' || 'false' }}
