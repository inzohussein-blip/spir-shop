# Builds a signed Android APK and publishes it as a GitHub Release.
#
# Trigger:
#   - push a tag:      git tag v1.1.0 && git push origin v1.1.0
#   - or run manually: Actions > Android APK > Run workflow (version, notes, required)
#
# Installed apps pick the new release up automatically: the backend's
# /store/mobile-version reads the latest release (MOBILE_GITHUB_REPO), the app
# shows "new version available" (or blocks when the release notes contain
# [required]), downloads the APK and opens the Android installer.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of credentials/spir-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional repository variable:
#   EXPO_PUBLIC_MEDUSA_BACKEND_URL   public server address baked into the APK
#                                    (users can still change it in the app settings)

name: Android APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.1.0)"
        required: true
      notes:
        description: "What's new (shown to users)"
        required: false
        default: ""
      required_update:
        description: "Required update (older versions are blocked)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then RAW="$INPUT_VERSION"; else RAW="$REF_NAME"; fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$RAW')"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Monotonic Android versionCode derived from the version: 1.2.3 -> 10203
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Missing ANDROID_* signing secrets. Updates must be signed with the same key as the installed app."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ANDROID_NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Set app version
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          node -e '
            const fs = require("fs")
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"))
            app.expo.version = process.env.VERSION
            app.expo.android.versionCode = Number(process.env.CODE)
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n")
          '

      - name: Write signing key and app config
        working-directory: apps/mobile
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BACKEND_URL: ${{ vars.EXPO_PUBLIC_MEDUSA_BACKEND_URL }}
        run: |
          mkdir -p credentials
          echo "$KS" | base64 -d > credentials/spir-release.jks
          {
            echo "SPIR_RELEASE_STORE_FILE=$PWD/credentials/spir-release.jks"
            echo "SPIR_RELEASE_STORE_PASSWORD=$KSP"
            echo "SPIR_RELEASE_KEY_ALIAS=$KA"
            echo "SPIR_RELEASE_KEY_PASSWORD=$KP"
          } > credentials/keystore.properties
          # The publishable key is discovered from the server at runtime (GET /mobile/config)
          echo "EXPO_PUBLIC_MEDUSA_BACKEND_URL=${BACKEND_URL:-http://localhost:9000}" > .env

      - name: Build signed APK
        working-directory: apps/mobile
        env:
          JDK17_HOME: ${{ env.JAVA_HOME }}
          GRADLE_WORKERS: "4"
        run: ./scripts/build-apk.sh

      - name: Verify signature
        working-directory: apps/mobile
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/spir-shop-${{ steps.version.outputs.version }}.apk" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Remove signing material
        if: always()
        working-directory: apps/mobile
        run: rm -rf credentials

      - uses: actions/upload-artifact@v4
        with:
          name: spir-shop-${{ steps.version.outputs.version }}
          path: apps/mobile/dist/*.apk
          retention-days: 30

      - name: Release notes
        id: notes
        env:
          NOTES: ${{ inputs.notes }}
          REQUIRED: ${{ inputs.required_update }}
        run: |
          {
            echo "body<<EOF"
            if [ -n "$NOTES" ]; then echo "$NOTES"; else echo "نسخة جديدة من تطبيق Spir Shop"; fi
            if [ "$REQUIRED" = "true" ]; then echo "[required]"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Spir Shop ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: apps/mobile/dist/spir-shop-${{ steps.version.outputs.version }}.apk
          make_latest: "true"
